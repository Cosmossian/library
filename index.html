/* Open Library lookup (free, no key; runs in the browser) */
let olCtl = null;
async function olSearch(q, onPick){
  q = (q || "").trim(); const msg = $("#olMsg"), res = $("#olRes");
  if (!q){ msg.textContent = "Type a title or author first."; return; }
  msg.textContent = "Searching…"; res.innerHTML = "";
  try{ if (olCtl) olCtl.abort(); }catch(e){}
  olCtl = new AbortController();
  const isbn = q.replace(/[-\s]/g, "");
  const param = /^(97[89])?\d{9}[\dX]$/i.test(isbn) ? "isbn=" + isbn : "q=" + encodeURIComponent(q);
  try{
    const r = await fetch("https://openlibrary.org/search.json?" + param + "&limit=8&fields=key,title,author_name,cover_i,number_of_pages_median,first_publish_year,isbn,subject", {signal: olCtl.signal});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const hits = (j.docs || []).map(doc => ({
      key: doc.key, title: doc.title, author: (doc.author_name || []).slice(0, 2).join(", "),
      pages: doc.number_of_pages_median || null, year: doc.first_publish_year || "",
      cover: doc.cover_i ? "https://covers.openlibrary.org/b/id/" + doc.cover_i + "-M.jpg" : "",
      isbn: (doc.isbn || [])[0] || "", genre: guessGenre(doc.subject || []),
    }));
    if (!hits.length){ msg.textContent = "Nothing found. Try fewer words, or type it in below."; return; }
    msg.textContent = "Tap the right one:";
    res.innerHTML = hits.map((h, i) => '<button class="result" type="button" data-i="' + i + '">' + coverHTML(h) + '<div><b>' + esc(h.title) + '</b><span>' + esc([h.author, h.year, h.pages ? h.pages + " pages" : ""].filter(Boolean).join(" · ")) + '</span></div></button>').join("");
    $$(".result", res).forEach(btn => btn.onclick = () => { $$(".result", res).forEach(x => x.classList.remove("picked")); btn.classList.add("picked"); onPick(hits[Number(btn.dataset.i)]); msg.textContent = "Filled in below. Check the page count against your copy."; });
  }catch(e){
    if (e.name === "AbortError") return;
    msg.textContent = "Couldn't reach Open Library right now. Type it in below instead.";
  }
}
function guessGenre(subjects){
  const s = subjects.slice(0, 40).join(" | ").toLowerCase();
  const rules = [["Graphic novel", /graphic novel|comic/], ["Children's", /juvenile|children/], ["Young adult", /young adult/], ["Science fiction", /science fiction/], ["Fantasy", /fantasy/], ["Horror", /horror/], ["Mystery", /mystery|detective/], ["Thriller", /thriller|suspense/], ["Romance", /romance|love stories/], ["Historical fiction", /historical fiction/], ["Biography", /biography/], ["Memoir", /memoir/], ["Self-help", /self-help|self-actualization/], ["Business", /business|management|economics/], ["History", /\bhistory\b/], ["Science", /science/], ["Poetry", /poetry/], ["Fiction", /fiction/]];
  const hit = rules.find(([, re]) => re.test(s));
  return hit ? hit[0] : "";
}

/* Reading session: stop the timer, log a past one, or change one */
function openSessionForm(b, s, fromLive){
  const isNew = !s;
  const ss = sessions(b);
  const last = ss[ss.length - 1];
  const lastChapter = last ? last.chapter || "" : "";
  const nextChapter = last && last.chapterDone && /^\d+$/.test(String(lastChapter).trim()) ? String(Number(lastChapter) + 1) : (last && !last.chapterDone ? lastChapter : "");
  let d;
  if (s) d = Object.assign({}, s);
  else if (fromLive && b.live) d = {start: b.live.start, end: new Date().toISOString(), startPage: b.live.startPage, endPage: "", chapter: nextChapter, chapterDone: false};
  else { const end = new Date(); end.setDate(end.getDate() - 1); end.setHours(21, 0, 0, 0); const start = new Date(end - 30 * 60000); d = {start: start.toISOString(), end: end.toISOString(), startPage: currentPage(b), endPage: "", chapter: nextChapter, chapterDone: false}; }
  const longLive = fromLive && (Date.now() - new Date(d.start)) > 4 * 3600000;
  modal(
    '<h3>' + (fromLive ? "Nice reading!" : isNew ? "Log a past session" : "Reading session") + '</h3>' +
    (fromLive ? '<div class="big-timer" data-live="' + b.id + '">' + fmtClock(Date.now() - new Date(d.start)) + '</div>' : "") +
    (longLive ? '<p class="banner" style="margin:0">That\'s a long one. If you forgot to stop the timer, fix the end time below.</p>' : "") +
    '<p class="hint">' + esc(b.title) + '</p>' +
    '<form id="sessForm" novalidate style="display:flex;flex-direction:column;gap:12px">' +
    (b.format !== "audio" ? '<div class="row2"><div class="field"><label for="s-from">Started on page</label><input class="inp num" id="s-from" type="number" min="0" inputmode="numeric" value="' + esc(d.startPage) + '"></div>' +
      '<div class="field"><label for="s-to">' + (fromLive ? "What page are you on now?" : "Ended on page") + '</label><input class="inp num" id="s-to" type="number" min="0" inputmode="numeric" value="' + esc(d.endPage) + '"' + (b.pages ? ' max="' + b.pages + '"' : "") + '></div></div>' : "") +
    '<div class="row2"><div class="field"><label for="s-ch">Chapter <span style="font-weight:500">(optional)</span></label><input class="inp" id="s-ch" value="' + esc(d.chapter) + '" placeholder="e.g. 3" list="chList"><datalist id="chList">' + Array.from(new Set(ss.map(x => x.chapter).filter(Boolean))).map(c => '<option value="' + esc(c) + '">').join("") + '</datalist></div>' +
      '<div class="field" style="justify-content:flex-end"><label class="check" style="color:var(--ink);font-size:15px"><input type="checkbox" id="s-chdone"' + (d.chapterDone ? " checked" : "") + '> I finished this chapter</label></div></div>' +
    '<details' + (fromLive && !longLive ? "" : " open") + '><summary class="hint" style="cursor:pointer">' + (fromLive ? "Change the times" : "Times") + '</summary><div class="row2" style="margin-top:10px">' +
      '<div class="field"><label for="s-start">Started</label><input class="inp" id="s-start" type="datetime-local" value="' + toLocalInput(d.start) + '"></div>' +
      '<div class="field"><label for="s-end">Stopped</label><input class="inp" id="s-end" type="datetime-local" value="' + toLocalInput(d.end) + '"></div></div></details>' +
    (b.status !== "finished" ? '<label class="check" id="w-done"' + (b.pages ? " hidden" : "") + '><input type="checkbox" id="s-bookdone"> I finished the book! 🎉</label>' : "") +
    '<div class="err" id="sErr" role="alert"></div>' +
    '<div class="acts-row">' +
      (fromLive ? '<button class="btn danger sm" type="button" id="sToss">Throw it away</button><span class="spacer"></span><button class="btn ghost" type="button" data-close>Keep reading</button>' :
        (isNew ? "" : '<button class="btn danger sm" type="button" id="sDel">Delete</button><span class="spacer"></span>') + '<button class="btn ghost" type="button" data-close>Cancel</button>') +
      '<button class="btn primary" type="submit">Save</button></div>' +
    '</form>');
  const to = $("#s-to"), wd = $("#w-done");
  if (to && wd && b.pages){
    const sync = () => { const full = Number(to.value) >= Number(b.pages); wd.hidden = !full; $("#s-bookdone").checked = full; };
    to.oninput = sync; sync();
  }
  if (fromLive && to) to.focus();
  if ($("#sToss")) $("#sToss").onclick = () => { if (!confirm("Throw away this session? The time won't be counted.")) return; b.live = null; saveBook(b); closeModal(); toast("Session thrown away."); };
  if ($("#sDel")) $("#sDel").onclick = () => { if (!confirm("Delete this session?")) return; b.sessions = b.sessions.filter(x => x.id !== s.id); saveBook(b); closeModal(); toast("Session deleted."); };
  $("#sessForm").onsubmit = e => {
    e.preventDefault();
    const err = $("#sErr");
    const start = fromLocalInput($("#s-start").value), end = fromLocalInput($("#s-end").value);
    if (!start || !end){ err.textContent = "Fill in both times."; return; }
    if (new Date(end) <= new Date(start)){ err.textContent = "The stop time has to be after the start time."; return; }
    if (new Date(end) - new Date(start) > 24 * 3600000){ err.textContent = "A session can't be longer than a day. Check the times."; return; }
    const from = $("#s-from") ? $("#s-from").value.trim() : "", toV = $("#s-to") ? $("#s-to").value.trim() : "";
    if (from !== "" && toV !== "" && Number(toV) < Number(from)){ err.textContent = "The end page is before the start page."; return; }
    if (b.pages && toV !== "" && Number(toV) > Number(b.pages)){ err.textContent = "This book has " + b.pages + " pages."; return; }
    const clash = state.books.flatMap(x => (x.sessions || []).map(y => ({x, y}))).find(o => (!s || o.y.id !== s.id) && new Date(o.y.start) < new Date(end) && new Date(o.y.end) > new Date(start));
    if (clash){ err.textContent = "That overlaps another session (" + clash.x.title + ", " + fmtDay(dayKey(clash.y.start)) + " " + fmtTime(clash.y.start) + " – " + fmtTime(clash.y.end) + "). Change the times."; return; }
    const rec = {id: s ? s.id : uid(), start, end, startPage: from === "" ? null : Number(from), endPage: toV === "" ? null : Number(toV), chapter: $("#s-ch").value.trim(), chapterDone: $("#s-chdone").checked};
    b.sessions = (b.sessions || []).filter(x => x.id !== rec.id).concat(rec);
    if (fromLive) b.live = null;
    if (!b.started || dayKey(start) < b.started) b.started = dayKey(start);
    if (b.status === "want") b.status = "reading";
    const doneBook = $("#s-bookdone") && $("#s-bookdone").checked;
    closeModal();
    if (doneBook){ b.status = "finished"; b.finished = dayKey(end); b.finishedPrec = "day"; b.needsDate = false; saveBook(b); openFinish(b, true); return; }
    saveBook(b);
    toast(fromLive ? "Saved: " + fmtDur(sessMin(rec)) + (sessPages(rec) ? ", " + plural(sessPages(rec), "page") : "") + "." : "Session saved.");
  };
}

/* Finished a book */
function openFinish(b, already){
  const st = bookStats(b);
  let rating = b.rating || 0;
  modal('<h3>' + (already ? "You finished it! 🎉" : "Finished “" + esc(b.title) + "”?") + '</h3>' +
    (already ? '<p><b>' + esc(b.title) + '</b> took ' + plural(daysBetween(b.started || b.finished, b.finished) + 1, "day") + (st.minutes ? " and " + fmtDur(st.minutes) + " of reading" : "") + '.</p>' :
      '<div class="field"><label for="fin-day">Finished on</label><input class="inp" id="fin-day" type="date" value="' + todayKey() + '"></div>') +
    '<div class="field"><span class="lbl">How was it?</span><div class="rate" id="fin-rate">' + [1,2,3,4,5].map(n => '<button type="button" data-r="' + n + '" class="' + (n <= rating ? "on" : "") + '" aria-label="' + n + ' stars">★</button>').join("") + '</div></div>' +
    '<div class="acts-row"><button class="btn ghost" type="button" data-close>' + (already ? "Skip" : "Not yet") + '</button><button class="btn primary" type="button" id="finGo">' + (already ? "Save rating" : "Mark finished") + '</button></div>');
  $$("#fin-rate button").forEach(x => x.onclick = () => { const n = Number(x.dataset.r); rating = rating === n ? 0 : n; $$("#fin-rate button").forEach(y => y.classList.toggle("on", Number(y.dataset.r) <= rating)); });
  $("#finGo").onclick = () => {
    if (!already){
      const day = $("#fin-day").value || todayKey();
      if (b.started && day < b.started){ toast("That's before you started it."); return; }
      b.status = "finished"; b.finished = day; b.finishedPrec = "day"; b.needsDate = false; b.live = null;
      if (!b.started) b.started = day;
    }
    b.rating = rating;
    saveBook(b); closeModal();
    toast("Added to your " + b.finished.slice(0, 4) + " shelf.");
  };
}

/* ============================================================
   Year in review: tap-through cards
   ============================================================ */
let story = null;
function buildCards(Y){
  const s = yearStats(Y), cards = [];
  const name = state.session ? (state.session.user.email || "").replace(KIDS_DOMAIN, "").split("@")[0] : "";
  const years = yearsWithData();
  const fan = list => '<div class="fan">' + list.slice(-7).map((b, i, a) => coverHTML(b, "transform:rotate(" + ((i - (a.length - 1) / 2) * 7) + "deg) translateY(" + Math.abs(i - (a.length - 1) / 2) * 6 + "px)")).join("") + '</div>';
  const isNow = Y === new Date().getFullYear();

  cards.push({bg: "linear-gradient(160deg,#FF6FA8,#A07BE0)", html:
    '<span class="eyebrow">The Library · Year in review</span><h2>' + (name ? esc(name) + "'s " : "Your ") + Y + ' in books</h2>' +
    (s.fin.length ? fan(s.fin) : "") +
    '<p>' + (isNow ? "So far this year. It keeps updating until December 31." : "Here's how it went.") + '</p>' +
    (years.length > 1 ? '<div class="yearpick" data-noadvance>' + years.map(y => '<button type="button" data-year="' + y + '" aria-pressed="' + (y === Y) + '">' + y + '</button>').join("") + '</div>' : "")});

  if (!s.fin.length && !s.sess.length){
    cards.push({bg: "#FFC628", html: '<span class="eyebrow">' + Y + '</span><h2>Nothing logged for ' + Y + ' yet</h2><p>Finish a book or time a reading session, and your year in review fills itself in.</p>'});
    return cards;
  }
  if (s.fin.length) cards.push({bg: "#FFC628", html:
    '<span class="eyebrow">Books finished</span><div class="huge" data-count="' + s.fin.length + '">' + s.fin.length + '</div>' +
    '<h2>' + (s.fin.length === 1 ? "book, start to finish." : "books, start to finish.") + '</h2>' +
    '<p>' + (s.started.length ? "You started " + plural(s.started.length, "book") + " this year" + (s.dnf.length ? " and set " + s.dnf.length + " aside" : "") + "." : "") + '</p>' +
    (() => { const dated = s.fin.filter(b => precOf(b) !== "year" && !b.needsDate); return dated.length ? '<p class="note">First one: ' + esc(dated[0].title) + ' (' + fmtFinished(dated[0]) + ')' + (dated.length > 1 ? '. Latest: ' + esc(dated[dated.length - 1].title) + '.' : '.') + '</p>' : ""; })()});
  if (s.pagesFin) cards.push({bg: "#3DBA70", html:
    '<span class="eyebrow">Pages</span><div class="huge" data-count="' + s.pagesFin + '">' + s.pagesFin.toLocaleString() + '</div><h2>pages turned.</h2>' +
    '<p>Stacked up, that\'s a pile of paper about ' + stackText(s.pagesFin) + ' tall.</p>' +
    (s.fin.length > 1 ? '<p class="note">That\'s ' + Math.round(s.pagesFin / s.fin.length) + ' pages per book on average.</p>' : "")});
  if (s.minutes >= 1) cards.push({bg: "#5B9BF0", html:
    '<span class="eyebrow">Time spent reading</span><div class="huge" data-count="' + Math.round(s.minutes / 60 * 10) / 10 + '">' + fmtHours(s.minutes) + '<small>hours</small></div>' +
    '<h2>over ' + plural(s.sess.length, "session") + '.</h2>' +
    '<p>Your average sit-down was ' + fmtDur(s.minutes / s.sess.length) + '.' + (s.longSess ? ' The longest: ' + fmtDur(sessMin(s.longSess.s)) + ' with ' + esc(s.longSess.b.title) + ' on ' + fmtDay(dayKey(s.longSess.s.start)) + '.' : '') + '</p>'});
  if (s.pph) cards.push({bg: "#FF8A4D", html:
    '<span class="eyebrow">Reading speed</span><div class="huge" data-count="' + Math.round(s.pph) + '">' + Math.round(s.pph) + '</div><h2>pages an hour.</h2>' +
    '<p>At that pace, a 300-page book takes about ' + fmtDur(300 / s.pph * 60) + '.</p>' +
    (s.sessPg ? '<p class="note">Measured from ' + plural(s.sessPg, "page") + ' you timed.</p>' : "")});
  if (s.topMonth != null && s.fin.length > 1){
    const max = Math.max(...s.byMonth, 1);
    cards.push({bg: "#A07BE0", html:
      '<span class="eyebrow">Your big month</span><h2>' + MONTHS_LONG[s.topMonth] + '</h2>' +
      '<p>' + plural(s.byMonth[s.topMonth], "book") + ' finished' + (s.topMinMonth != null && s.minByMonth[s.topMinMonth] ? (s.topMinMonth === s.topMonth ? ", and your most reading time too (" + fmtDur(s.minByMonth[s.topMinMonth]) + ")." : ". Most time reading: " + MONTHS_LONG[s.topMinMonth] + " (" + fmtDur(s.minByMonth[s.topMinMonth]) + ").") : ".") + '</p>' +
      '<div class="months">' + s.byMonth.map((n, i) => '<div class="' + (i === s.topMonth ? "top" : "") + '"><span>' + (n || "") + '</span><i style="height:' + Math.max(3, Math.round(n / max * 110)) + 'px;animation-delay:' + i * 0.04 + 's"></i><span>' + MONTHS[i][0] + '</span></div>').join("") + '</div>'});
  }
  if (s.fastest || s.longest){
    let h = '<span class="eyebrow">Records</span><h2>Fastest and biggest</h2>';
    if (s.fastest) h += '<div class="pair">' + coverHTML(s.fastest.b) + '<div class="t"><span>Fastest read</span><b>' + esc(s.fastest.b.title) + '</b><span>' + plural(s.fastest.days, "day") + (s.fastest.b.pages ? " · " + s.fastest.b.pages + " pages" : "") + '</span></div></div>';
    if (s.longest && (!s.fastest || s.longest.id !== s.fastest.b.id || s.fin.length === 1)) h += '<div class="pair">' + coverHTML(s.longest) + '<div class="t"><span>Biggest book</span><b>' + esc(s.longest.title) + '</b><span>' + Number(s.longest.pages).toLocaleString() + ' pages</span></div></div>';
    if (s.avgDays) h += '<p class="note">On average a book took you ' + plural(Math.round(s.avgDays), "day") + '.</p>';
    cards.push({bg: "#FF6FA8", html: h});
  }
  if (s.streak.days >= 2 || s.sess.length >= 3){
    const dowMax = s.dow.indexOf(Math.max(...s.dow));
    const todMax = Object.entries(s.tod).sort((a, b) => b[1] - a[1])[0][0];
    const todText = {morning: "a morning reader", afternoon: "an afternoon reader", evening: "an evening reader", night: "a night owl"}[todMax];
    cards.push({bg: "#FFC628", html:
      '<span class="eyebrow">Your reading habits</span>' +
      (s.streak.days >= 2 ? '<div class="huge" data-count="' + s.streak.days + '">' + s.streak.days + '<small>days</small></div><h2>in a row: your longest streak.</h2><p>' + fmtDay(s.streak.start) + ' to ' + fmtDay(s.streak.end) + '.</p>' : '<h2>' + plural(s.dayset.size, "day") + ' with a book open</h2>') +
      '<p>You\'re ' + todText + ', and ' + DAYS_LONG[dowMax] + 's were your big reading day.</p>' +
      (s.dayset.size ? '<p class="note">' + plural(s.dayset.size, "day") + ' with a reading session this year.</p>' : "")});
  }
  if ((s.authors[0] && s.authors[0][1] > 1) || s.genres[0]){
    let h = '<span class="eyebrow">Your favorites</span>';
    if (s.authors[0] && s.authors[0][1] > 1) h += '<h2>' + esc(s.authors[0][0]) + '</h2><p>was your go-to author: ' + plural(s.authors[0][1], "book") + ' this year.</p>';
    if (s.genres[0]) h += (s.authors[0] && s.authors[0][1] > 1 ? '<p style="margin-top:14px">' : '<h2>' + esc(s.genres[0][0]) + '</h2><p>') + (s.authors[0] && s.authors[0][1] > 1 ? 'Favorite genre: <b>' + esc(s.genres[0][0]) + '</b> (' + plural(s.genres[0][1], "book") + ')' : 'was your favorite genre: ' + plural(s.genres[0][1], "book")) + (s.genres.length > 1 ? ", out of " + plural(s.genres.length, "genre") + " you tried" : "") + '.</p>';
    cards.push({bg: "#3DBA70", html: h});
  }
  if (s.rated.length){
    const top = s.rated.filter(b => b.rating === s.rated[0].rating).slice(0, 3);
    cards.push({bg: "#5B9BF0", html:
      '<span class="eyebrow">Top rated</span><h2>' + (top.length > 1 ? "Your favorites" : "Your favorite") + '</h2>' +
      top.map(b => '<div class="pair">' + coverHTML(b) + '<div class="t"><b>' + esc(b.title) + '</b><span>' + esc(b.author || "") + '</span><div class="stars" style="color:#17201A;font-size:18px">' + "★".repeat(b.rating) + '</div></div></div>').join("")});
  }
  // Summary
  cards.push({bg: "linear-gradient(160deg,#A07BE0,#FF6FA8)", html:
    '<span class="eyebrow">' + (name ? esc(name) + "'s " : "") + Y + ' in books</span>' +
    (s.fin.length ? '<div class="wall">' + s.fin.slice(0, 18).map(b => coverHTML(b)).join("") + '</div>' : "") +
    '<div class="summary">' +
      '<div><b>' + s.fin.length + '</b><span>books finished</span></div>' +
      '<div><b>' + s.pagesFin.toLocaleString() + '</b><span>pages</span></div>' +
      (s.minutes ? '<div><b>' + fmtHours(s.minutes) + ' h</b><span>reading</span></div>' : "") +
      (s.pph ? '<div><b>' + Math.round(s.pph) + '</b><span>pages an hour</span></div>' : "") +
      (s.streak.days >= 2 ? '<div><b>' + s.streak.days + ' days</b><span>longest streak</span></div>' : "") +
      (s.rated[0] ? '<div><b style="font-size:18px">' + esc(s.rated[0].title) + '</b><span>top rated</span></div>' : "") +
    '</div>' +
    '<a class="btn" href="#/review/' + Y + '/all" data-noadvance style="background:#FFF8EC;color:#17201A">See it all ▸</a>'});
  return cards;
}
function stackText(pages){
  const inches = pages * 0.0035; // paperback paper, roughly
  if (inches < 12) return (Math.round(inches * 10) / 10) + " inches";
  const ft = inches / 12;
  return (Math.round(ft * 10) / 10) + " feet";
}
function openStory(Y){
  if (story && story.Y === Y){ return; }
  const cards = buildCards(Y);
  story = {Y, cards, i: 0};
  const root = $("#storyRoot");
  root.innerHTML = '<div class="story" role="dialog" aria-modal="true" aria-label="Year in review ' + Y + '"><div class="story-frame" id="sf">' +
    '<div class="bars">' + cards.map(() => "<i></i>").join("") + '</div>' +
    '<button class="story-all" type="button" id="stAll">See it all</button>' +
    '<button class="story-x" type="button" id="stX" aria-label="Close">✕</button>' +
    '<div id="stCard"></div>' +
    '<button class="tapzone prev" type="button" aria-label="Back" id="stPrev"></button><button class="tapzone next" type="button" aria-label="Next" id="stNext"></button>' +
  '</div></div>';
  document.body.style.overflow = "hidden";
  $("#stX").onclick = () => { location.hash = "#/"; };
  $("#stAll").onclick = () => { location.hash = "#/review/" + Y + "/all"; };
  $("#stPrev").onclick = () => storyGo(-1);
  $("#stNext").onclick = () => storyGo(1);
  document.addEventListener("keydown", storyKeys);
  showCard();
}
function storyKeys(e){
  if (!story) return;
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); storyGo(1); }
  else if (e.key === "ArrowLeft"){ storyGo(-1); }
  else if (e.key === "Escape"){ location.hash = "#/"; }
}
function storyGo(d){
  if (!story) return;
  const n = story.i + d;
  if (n < 0) return;
  if (n >= story.cards.length){ location.hash = "#/review/" + story.Y + "/all"; return; }
  story.i = n; showCard();
}
function showCard(){
  const c = story.cards[story.i];
  $$(".bars i").forEach((el, i) => { el.className = i < story.i ? "done" : i === story.i ? "cur" : ""; });
  const holder = $("#stCard");
  holder.innerHTML = '<div class="card rise" style="--cbg:' + c.bg + '">' + c.html + (story.i === 0 ? '<div class="tapnote">Tap to keep going ▸</div>' : "") + '</div>';
  // Buttons inside a card sit above the tap zones.
  $$("[data-noadvance], .card a, .card button", holder).forEach(el => { el.style.position = "relative"; el.style.zIndex = 6; });
  $$("[data-year]", holder).forEach(btn => btn.onclick = () => { location.hash = "#/review/" + btn.dataset.year; });
  $$("[data-count]", holder).forEach(countUp);
}
function countUp(el){
  const target = Number(el.dataset.count); if (!isFinite(target) || target <= 0) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const small = el.querySelector("small"); const tail = small ? small.outerHTML : "";
  const dec = target % 1 ? 1 : 0, t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));
    el.innerHTML = (dec ? (Math.round(v * 10) / 10).toLocaleString() : Math.round(v).toLocaleString()) + tail;
    if (p < 1 && document.contains(el)) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function closeStory(){
  if (!story) return;
  story = null; $("#storyRoot").innerHTML = ""; document.body.style.overflow = "";
  document.removeEventListener("keydown", storyKeys);
}

/* ---------- year in review: see it all ---------- */
function renderYearAll(main, Y){
  const s = yearStats(Y), years = yearsWithData();
  let html = '<a class="btn ghost back" href="#/">← The shelf</a>';
  html += '<div class="yr-head"><h2>' + Y + ' in books</h2><div style="display:flex;gap:10px;flex-wrap:wrap">' +
    (years.length > 1 ? '<select class="inp" id="yrPick" style="width:auto" aria-label="Year">' + years.map(y => '<option' + (y === Y ? " selected" : "") + '>' + y + '</option>').join("") + '</select>' : "") +
    '<a class="btn gold" href="#/review/' + Y + '">▶ Play the cards</a></div></div>';
  html += '<div class="strip" style="margin-top:18px">' +
    tile("Books finished", s.fin.length, s.started.length ? plural(s.started.length, "started", "started") + (s.dnf.length ? " · " + s.dnf.length + " set aside" : "") : "") +
    tile("Pages", s.pagesFin.toLocaleString(), s.fin.length ? Math.round(s.pagesFin / s.fin.length) + " per book" : "") +
    tile("Time reading", s.minutes ? fmtHours(s.minutes) + "<small> h</small>" : "–", s.sess.length ? plural(s.sess.length, "session") + " · avg " + fmtDur(s.minutes / s.sess.length) : "no timed sessions") +
    tile("Speed", s.pph ? Math.round(s.pph) + "<small> pages/h</small>" : "–", s.pph ? "from timed sessions" : "needs pages on sessions") +
    tile("Avg days per book", s.avgDays ? Math.round(s.avgDays) : "–", "start to finish") +
    tile("Longest streak", s.streak.days ? s.streak.days + "<small> days</small>" : "–", s.streak.days > 1 ? fmtDay(s.streak.start) + " – " + fmtDay(s.streak.end) : "") +
  '</div>';
  const maxB = Math.max(...s.byMonth, 1), maxM = Math.max(...s.minByMonth, 1);
  html += '<div class="two" style="margin-top:22px">' +
    '<div class="panel"><h3 style="font-size:20px">Books finished by month</h3><div class="chart">' + s.byMonth.map((n, i) => '<div class="col"><b>' + (n || "") + '</b><i style="height:' + Math.round(n / maxB * 140) + 'px"></i><span>' + MONTHS[i] + '</span></div>').join("") + '</div></div>' +
    '<div class="panel"><h3 style="font-size:20px">Hours reading by month</h3><div class="chart">' + s.minByMonth.map((m, i) => '<div class="col"><b>' + (m ? fmtHours(m) : "") + '</b><i style="height:' + Math.round(m / maxM * 140) + 'px;background:var(--blue)"></i><span>' + MONTHS[i] + '</span></div>').join("") + '</div></div>' +
  '</div>';
  const hl = [];
  if (s.fastest) hl.push(['Fastest read', s.fastest.b, plural(s.fastest.days, "day")]);
  if (s.slowest && s.slowest !== s.fastest) hl.push(['Took the longest', s.slowest.b, plural(s.slowest.days, "day")]);
  if (s.longest) hl.push(['Biggest book', s.longest, Number(s.longest.pages).toLocaleString() + " pages"]);
  if (s.shortest && s.shortest !== s.longest) hl.push(['Shortest book', s.shortest, Number(s.shortest.pages).toLocaleString() + " pages"]);
  if (s.mostTime) hl.push(['Most time with', s.mostTime[0], fmtDur(s.mostTime[1])]);
  if (s.rated[0]) hl.push(['Top rated', s.rated[0], "★".repeat(s.rated[0].rating)]);
  const favs = [];
  if (s.authors.length) favs.push(["Top authors", s.authors.slice(0, 5)]);
  if (s.genres.length) favs.push(["Genres", s.genres.slice(0, 6)]);
  const fm = s.formats.filter(f => f[0]);
  if (fm.length > 1) favs.push(["Formats", fm.map(([k, n]) => [FORMATS[k] || k, n])]);
  html += '<div class="two" style="margin-top:22px">' +
    '<div class="panel"><h3 style="font-size:20px;margin-bottom:6px">Highlights</h3>' + (hl.length ? hl.map(([k, b, v]) => '<a class="hl" href="#/book/' + b.id + '" style="text-decoration:none">' + coverHTML(b) + '<div><div class="k">' + k + '</div><b>' + esc(b.title) + '</b><span>' + esc(v) + '</span></div></a>').join("") : '<p class="hint">Finish a book to see highlights.</p>') + '</div>' +
    '<div class="panel"><h3 style="font-size:20px;margin-bottom:10px">Favorites</h3>' + (favs.length ? favs.map(([t, list]) => '<p class="hint" style="margin:10px 0 6px;font-weight:700">' + t + '</p><div style="display:flex;gap:6px;flex-wrap:wrap">' + list.map(([n, c]) => '<span class="chip pink">' + esc(n) + ' · ' + c + '</span>').join("") + '</div>').join("") : '<p class="hint">Add authors and genres to your books to see favorites.</p>') +
      (s.sess.length ? '<p class="hint" style="margin:16px 0 6px;font-weight:700">When you read</p><div style="display:flex;gap:6px;flex-wrap:wrap">' + Object.entries(s.tod).filter(x => x[1]).sort((a, b) => b[1] - a[1]).map(([k, m]) => '<span class="chip">' + k + ' · ' + fmtDur(m) + '</span>').join("") + '</div>' : "") +
    '</div></div>';
  html += '<div class="sec-h"><h2>Every book from ' + Y + '</h2><span class="sub">in the order you finished them</span></div>';
  if (s.fin.length){
    html += '<div class="panel tablewrap"><table class="list"><thead><tr><th>#</th><th>Book</th><th>Finished</th><th class="r">Days</th><th class="r">Pages</th><th class="r">Time</th><th>Rating</th></tr></thead><tbody>' +
      s.fin.map((b, i) => { const st = bookStats(b); return '<tr class="click" data-go="' + b.id + '"><td class="num">' + (i + 1) + '</td><td><b>' + esc(b.title) + '</b>' + (b.author ? '<br><span class="hint">' + esc(b.author) + '</span>' : "") + '</td><td>' + (fmtFinished(b) || "–") + '</td><td class="r num">' + (st.days || "–") + '</td><td class="r num">' + (b.pages || "–") + '</td><td class="r num">' + (st.minutes ? fmtDur(st.minutes) : "–") + '</td><td class="stars">' + stars(b.rating) + '</td></tr>'; }).join("") +
      '</tbody></table></div>';
  } else html += '<div class="empty">No finished books in ' + Y + '.</div>';
  main.innerHTML = html;
  if ($("#yrPick")) $("#yrPick").onchange = e => { location.hash = "#/review/" + e.target.value + "/all"; };
  $$("[data-go]", main).forEach(tr => tr.onclick = () => { location.hash = "#/book/" + tr.dataset.go; });
  window.scrollTo(0, 0);
}

init();
</script>
</body>
