<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Library · Book Log</title>
<meta name="description" content="A book log: what you're reading, how fast, and your year in books.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23FF6FA8' stroke='%2317201A' stroke-width='4'/%3E%3Cpath d='M18 18h12a4 4 0 0 1 4 4v24a3 3 0 0 0-3-3H18zM46 18H38a4 4 0 0 0-4 4v24a3 3 0 0 1 3-3h9z' fill='%23FFF8EC' stroke='%2317201A' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: same chunky outlined look as the other sections, always dark, Library pink as the accent. Books are the color: covers do the work. */
:root{
  --bg:#111512; --surface:#1A201C; --surface2:#222A24; --ink:#EDF1E9; --muted:#A3AEA5; --line:#3C463F; --soft:#262E28; --shadow:#000;
  --library:#FF6FA8; --library-dark:#C9407A; --gold:#FFC628; --green:#3DBA70; --blue:#5B9BF0; --purple:#A07BE0; --orange:#FF8A4D; --danger:#FF6A4D;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--library);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:52px;height:52px;flex:none;border:2px solid #17201A;border-radius:14px;background:var(--library);box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center}
.logo svg{width:30px;height:30px}
.brand h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who{font-size:13px;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--library);color:#17201A;border-color:#17201A}
.btn.gold{background:var(--gold);color:#17201A;border-color:#17201A}
.btn.go{background:var(--green);color:#17201A;border-color:#17201A}
.btn.stop{background:var(--orange);color:#17201A;border-color:#17201A}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--shadow)}
.link-btn{border:none;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* Panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.sec-h h2{font-size:26px;font-weight:800}
.sec-h .sub{color:var(--muted);font-size:14px}
.banner{border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:18px;color:var(--ink);background:rgba(255,198,40,.08);font-size:15px}
.banner code{font-family:var(--mono);font-size:13px}

/* Covers */
.cover{position:relative;flex:none;container-type:inline-size;width:var(--cw,72px);aspect-ratio:2/3;border:2px solid #17201A;border-radius:6px 10px 10px 6px;overflow:hidden;background:var(--soft);box-shadow:3px 3px 0 var(--shadow)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .fake{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;font-family:var(--display);font-weight:800;color:#17201A;font-size:14cqw;line-height:1.05;background:hsl(var(--h,330) 85% 72%);overflow:hidden;word-break:break-word}
.cover .fake::before{content:"";position:absolute;left:7%;top:0;bottom:0;width:3px;background:rgba(0,0,0,.18)}

/* Stats strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--shadow)}
.tile .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.15;margin-top:4px}
.tile .v small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.review-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px;padding:16px 20px;border:2px solid #17201A;border-radius:18px;background:linear-gradient(120deg,var(--library) 0%,var(--purple) 100%);color:#17201A;box-shadow:5px 5px 0 var(--shadow)}
.review-cta h3{font-size:22px;font-weight:800}
.review-cta p{margin:2px 0 0;font-weight:600;font-size:14px}

/* Reading now */
.now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.now{display:flex;gap:16px;align-items:flex-start;--cw:86px}
.now .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.now h3{font-size:20px;font-weight:800}
.now h3 a{text-decoration:none}
.now h3 a:hover{text-decoration:underline}
.by{color:var(--muted);font-size:14px;margin:0}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--library);border-radius:999px}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--ink)}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:600;color:var(--orange)}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.empty{border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

/* Shelf filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--library);color:#17201A}
.seg button .c{font-family:var(--mono);font-size:12px;opacity:.8;margin-left:4px}
.inp,select.inp{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.inp:focus{border-color:var(--library);outline:none}
.searchbox{flex:1 1 200px;max-width:320px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;margin-top:18px}
.spine{display:flex;flex-direction:column;gap:8px;text-decoration:none;--cw:100%}
.spine .cover{width:100%;transition:transform .15s}
.spine:hover .cover{transform:translateY(-4px) rotate(-1deg)}
.spine h4{font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:0;line-height:1.25}
.spine .by{font-size:13px}
.spine .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pink{border-color:var(--library);color:var(--library)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.green{border-color:var(--green);color:var(--green)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.year-h{grid-column:1/-1;font-family:var(--display);font-size:20px;font-weight:800;border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:6px}

/* Book page */
.back{display:inline-flex;margin-bottom:16px}
.book-head{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;--cw:150px}
.book-head .info{flex:1;min-width:260px;display:flex;flex-direction:column;gap:10px}
.book-head h2{font-size:clamp(28px,4vw,40px);font-weight:800}
.book-head .acts{display:flex;gap:10px;flex-wrap:wrap}
.status-pill{align-self:flex-start;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;border:2px solid #17201A;color:#17201A}
.st-reading{background:var(--library)} .st-finished{background:var(--green)} .st-want{background:var(--blue)} .st-dnf{background:var(--muted)}
.pageset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pageset .inp{width:90px;padding:6px 10px}
.notes{white-space:pre-wrap;color:var(--muted);font-size:15px;margin:0}

table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--soft)}
table.list td.r,table.list th.r{text-align:right}
.tablewrap{overflow-x:auto}

/* Modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{width:100%;max-width:560px;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:24px;font-weight:800}
.modal p{margin:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.acts-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.acts-row .spacer{flex:1}
.err{color:var(--danger);font-weight:700;font-size:14px;min-height:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--library)}
.results{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow-y:auto}
.result{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;--cw:42px}
.result:hover,.result.picked{border-color:var(--library)}
.result .cover{box-shadow:none}
.result b{display:block;line-height:1.25}
.result span{font-size:13px;color:var(--muted)}
.rate{display:flex;gap:2px}
.rate button{border:none;background:none;font-size:28px;line-height:1;padding:0 2px;cursor:pointer;color:var(--line)}
.rate button.on{color:var(--gold)}
.big-timer{font-family:var(--mono);font-size:42px;font-weight:600;color:var(--orange);text-align:center}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:4px 4px 0 var(--shadow);max-width:90vw}

/* Sign-in gate */
.gate{max-width:440px;margin:40px auto 0;display:flex;flex-direction:column;gap:14px}
.gate h2{font-size:30px;font-weight:800}

/* Year in review: cards */
.story{position:fixed;inset:0;z-index:70;background:#0A0D0B;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.story-frame{position:relative;width:min(100vw,460px);height:min(100dvh,820px);overflow:hidden;border-radius:0}
@media (min-width:520px){.story-frame{border:3px solid #17201A;border-radius:26px;height:min(92dvh,820px);box-shadow:8px 8px 0 #000}}
.bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:4px;border-radius:4px;background:rgba(23,32,26,.25);overflow:hidden}
.bars i.done{background:#17201A}
.bars i.cur{background:linear-gradient(90deg,#17201A 50%,rgba(23,32,26,.25) 50%);background-size:200% 100%;background-position:100% 0;animation:fill .5s forwards}
@keyframes fill{to{background-position:0 0}}
.story-x{position:absolute;top:24px;right:14px;z-index:6;width:40px;height:40px;border-radius:50%;border:2px solid #17201A;background:rgba(255,255,255,.65);color:#17201A;font-size:20px;font-weight:800;cursor:pointer}
.story-all{position:absolute;top:28px;left:14px;z-index:6;border:2px solid #17201A;background:rgba(255,255,255,.65);color:#17201A;font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px;cursor:pointer}
.card{position:absolute;inset:0;padding:84px 28px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#17201A;background:var(--cbg,var(--library))}
.card .eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.75}
.card h2{font-size:clamp(30px,8vw,44px);font-weight:800;line-height:1.02}
.card .huge{font-family:var(--display);font-weight:800;font-size:clamp(84px,26vw,140px);line-height:.9;letter-spacing:-.04em}
.card .huge small{font-size:.3em;letter-spacing:0;margin-left:6px}
.card p{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.card .note{font-size:15px;opacity:.8;font-weight:600}
.card .tapnote{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;opacity:.55}
.card .fan{display:flex;justify-content:center;margin:6px 0;min-height:120px;--cw:78px}
.card .fan .cover{margin:0 -14px;transition:transform .5s}
.card .pair{display:flex;gap:16px;align-items:center;--cw:90px}
.card .pair + .pair{margin-top:6px}
.card .pair .t b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.card .pair .t span{font-weight:700;opacity:.8}
.card .months{display:flex;align-items:flex-end;gap:5px;margin-top:6px}
.card .months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;font-weight:800}
.card .months i{display:block;width:100%;background:#17201A;border-radius:5px 5px 2px 2px;min-height:3px;transform-origin:bottom;animation:grow .6s both}
.card .months div.top i{background:#FFF8EC;border:2px solid #17201A}
@keyframes grow{from{transform:scaleY(0)}}
.card .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .summary div{background:rgba(255,255,255,.4);border:2px solid #17201A;border-radius:14px;padding:10px 12px}
.card .summary b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.card .summary span{font-size:13px;font-weight:700}
.card .wall{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;--cw:100%}
.card .wall .cover{box-shadow:2px 2px 0 #17201A;border-width:1.5px}
.card .btn{align-self:flex-start;border-color:#17201A}
.card .yearpick{display:flex;gap:8px;flex-wrap:wrap}
.card .yearpick button{border:2px solid #17201A;background:rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer;color:#17201A}
.card .yearpick button[aria-pressed=true]{background:#17201A;color:#FFF8EC}
.card.rise > *{animation:rise .5s both}
.card.rise > *:nth-child(2){animation-delay:.08s}.card.rise > *:nth-child(3){animation-delay:.16s}.card.rise > *:nth-child(4){animation-delay:.24s}.card.rise > *:nth-child(5){animation-delay:.32s}.card.rise > *:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.tapzone{position:absolute;top:70px;bottom:0;z-index:4;background:transparent;border:none;cursor:pointer}
.tapzone.prev{left:0;width:32%}
.tapzone.next{right:0;width:68%}

/* Year in review: see it all */
.yr-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.yr-head h2{font-size:clamp(30px,5vw,46px);font-weight:800}
.chart{display:flex;align-items:flex-end;gap:8px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.chart .col i{display:block;width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:var(--library);min-height:2px}
.chart .col span{font-size:12px;color:var(--muted);font-weight:700}
.chart .col b{font-family:var(--mono);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hl{display:flex;gap:14px;align-items:center;--cw:60px;padding:10px 0;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:none}
.hl .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--library)}
.hl b{display:block;font-size:16px;line-height:1.25}
.hl span{font-size:13px;color:var(--muted)}

footer{margin-top:50px;color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

@media (max-width:640px){
  .wrap{padding:18px 14px 70px}
  .two{grid-template-columns:1fr}
  .now-grid{grid-template-columns:1fr}
  .now{--cw:72px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 14px}
  .book-head{--cw:110px;gap:16px}
  .row3{grid-template-columns:1fr 1fr}
  .ov{padding:16px 10px}
  .chart{gap:4px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <a class="logo" href="#/" aria-label="The Library home"><svg viewBox="0 0 32 32" fill="none" stroke="#17201A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 7h8a4 4 0 0 1 4 4v15a3 3 0 0 0-3-3H4zM28 7h-8a4 4 0 0 0-4 4v15a3 3 0 0 1 3-3h9z" fill="#FFF8EC"/></svg></a>
      <div>
        <h1>The Library</h1>
        <p id="whoLine">Your book log</p>
      </div>
    </div>
    <div class="top-actions" id="topActs"></div>
  </header>
  <div id="banner"></div>
  <main id="main" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<div class="ov" id="ov" hidden></div>
<div id="storyRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/nav.js" defer></script>
<script>
"use strict";
/* ============================================================
   The Library: a book log with reading sessions and a year in review.
   Data: Supabase table library_books (one row per book: id, user_id, data jsonb), private per account.
   The book list is cached in localStorage so the page opens instantly, then refreshed from the database.
   Without an account it can run on this device only (localStorage "library-books").
   Book data: {title, author, pages, format, genre, cover, olKey, isbn, status, started, finished,
               rating, notes, page, live:{start, startPage}, sessions:[{id,start,end,startPage,endPage,chapter,chapterDone}], added, updated}
   ============================================================ */
const CFG = window.LIBRARY_CONFIG || {};
const KIDS_DOMAIN = "@kids.thatonedrawer.com";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const STATUS = {reading:"Reading now", finished:"Finished", want:"Want to read", dnf:"Didn't finish"};
const FORMATS = {print:"Print", ebook:"E-book", audio:"Audiobook"};
const GENRES = ["Fiction","Fantasy","Science fiction","Mystery","Thriller","Horror","Romance","Historical fiction","Literary fiction","Young adult","Children's","Graphic novel","Poetry","Nonfiction","Biography","Memoir","History","Science","Self-help","Business","Religion","Philosophy","Cooking","Humor","Travel"];

let sb = null;
const state = {
  mode: "loading",      // loading | gate | db | local
  session: null,
  books: [],
  tableMissing: false,
  filter: "finished",
  shelfYear: "all",
  q: "",
};
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); }); } }
function cacheKey(){ return state.mode === "db" && state.session ? "library-cache:" + state.session.user.id : "library-books"; }
function queueKey(){ return state.session ? "library-queue:" + state.session.user.id : "library-queue"; }

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
function dayKey(d){ d = d instanceof Date ? d : new Date(d); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function todayKey(){ return dayKey(new Date()); }
function parseDay(s){ if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function daysBetween(a, b){ return Math.round((parseDay(b) - parseDay(a)) / 86400000); }
function addDays(key, n){ const d = parseDay(key); d.setDate(d.getDate() + n); return dayKey(d); }
function toLocalInput(d){ d = d instanceof Date ? d : new Date(d); return dayKey(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fromLocalInput(s){ const d = new Date(s); return isNaN(d) ? null : d.toISOString(); }
function fmtDay(s, withYear){
  const d = parseDay(s); if (!d) return "";
  const y = withYear || d.getFullYear() !== new Date().getFullYear();
  return MONTHS[d.getMonth()] + " " + d.getDate() + (y ? ", " + d.getFullYear() : "");
}
// Finish dates can be exact (finishedPrec "day", the default), just a month ("month", stored as YYYY-MM-01)
// or just a year ("year", stored as YYYY-01-01). needsDate = finished books added before dates were asked for properly.
function precOf(b){ return b.finishedPrec === "month" || b.finishedPrec === "year" ? b.finishedPrec : "day"; }
function fmtFinished(b, long){
  if (!b.finished) return "";
  if (b.needsDate) return "date not set";
  const d = parseDay(b.finished), p = precOf(b);
  if (p === "year") return String(d.getFullYear());
  if (p === "month") return (long ? MONTHS_LONG : MONTHS)[d.getMonth()] + " " + d.getFullYear();
  return fmtDay(b.finished);
}
function fmtTime(iso){ const d = new Date(iso); let h = d.getHours(); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return h + ":" + pad(d.getMinutes()) + " " + ap; }
function fmtDur(min){
  min = Math.round(min || 0);
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60), m = min % 60;
  return h + " h" + (m ? " " + m + " min" : "");
}
function fmtHours(min){ const h = min / 60; return h >= 10 ? Math.round(h).toLocaleString() : (Math.round(h * 10) / 10).toLocaleString(); }
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(ss); }
function plural(n, one, many){ return n.toLocaleString() + " " + (n === 1 ? one : (many || one + "s")); }

/* ---------- book math ---------- */
function sessMin(s){ if (!s.start || !s.end) return 0; return Math.max(0, (new Date(s.end) - new Date(s.start)) / 60000); }
function sessPages(s){ const a = Number(s.startPage), b = Number(s.endPage); return (s.startPage !== "" && s.endPage !== "" && s.startPage != null && s.endPage != null && isFinite(a) && isFinite(b) && b >= a) ? b - a : null; }
function sessions(b){ return (b.sessions || []).slice().sort((x, y) => new Date(x.start) - new Date(y.start)); }
function currentPage(b){
  let p = Number(b.page) || 0;
  (b.sessions || []).forEach(s => { const e = Number(s.endPage); if (isFinite(e) && e > p) p = e; });
  if (b.status === "finished" && b.pages) p = Math.max(p, Number(b.pages));
  return p;
}
function progress(b){ const p = Number(b.pages); return p > 0 ? Math.min(1, currentPage(b) / p) : 0; }
function chapterStats(b){
  const map = new Map();
  sessions(b).forEach(s => {
    const label = String(s.chapter || "").trim(); if (!label) return;
    const c = map.get(label) || {label, minutes: 0, pages: 0, sessions: 0, done: false, first: s.start, last: s.end};
    c.minutes += sessMin(s); c.pages += sessPages(s) || 0; c.sessions++; c.done = c.done || !!s.chapterDone; c.last = s.end;
    map.set(label, c);
  });
  const list = Array.from(map.values());
  const done = list.filter(c => c.done && c.minutes > 0);
  return {list, avgDone: done.length ? done.reduce((a, c) => a + c.minutes, 0) / done.length : null, doneCount: done.length};
}
function speedOf(list){ // list of sessions → pages per hour (only sessions with pages)
  let pg = 0, mn = 0;
  list.forEach(s => { const p = sessPages(s), m = sessMin(s); if (p != null && p > 0 && m > 0){ pg += p; mn += m; } });
  return mn >= 5 ? pg / (mn / 60) : null;
}
function bookStats(b){
  const ss = sessions(b);
  const minutes = ss.reduce((a, s) => a + sessMin(s), 0);
  const pph = b.format === "audio" ? null : speedOf(ss);
  let days = null;
  const done = b.status === "finished" || b.status === "dnf";
  if (b.started && (!done || (b.finished && precOf(b) === "day" && !b.needsDate))){ days = daysBetween(b.started, done ? b.finished : todayKey()) + 1; }
  const left = b.pages ? Math.max(0, Number(b.pages) - currentPage(b)) : null;
  return {ss, minutes, pph, days, left, ch: chapterStats(b)};
}
function overallSpeed(){ return speedOf([].concat(...state.books.filter(b => b.format !== "audio").map(b => b.sessions || []))); }
function hueOf(s){ let h = 0; s = String(s || ""); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function stars(n){ n = Math.round(n || 0); return n ? "★".repeat(n) + "<span style=\"opacity:.3\">" + "★".repeat(5 - n) + "</span>" : ""; }
function coverHTML(b, extra){
  return '<span class="cover" style="--h:' + hueOf(b.title + b.author) + (extra ? ";" + extra : "") + '">' +
    (b.cover ? '<img src="' + esc(b.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : "") +
    '<span class="fake">' + esc(b.title || "Untitled") + '</span></span>';
}
// Broken cover pictures fall back to the colored "fake" cover underneath.
document.addEventListener("error", e => { if (e.target.tagName === "IMG" && e.target.parentNode && e.target.parentNode.classList.contains("cover")) e.target.remove(); }, true);

/* ---------- streaks & years ---------- */
function readingDays(){ // set of day keys with a session (or a live session today)
  const set = new Set();
  state.books.forEach(b => { (b.sessions || []).forEach(s => { if (s.start) set.add(dayKey(s.start)); }); if (b.live) set.add(todayKey()); });
  return set;
}
function longestStreak(keys){
  const list = Array.from(keys).sort(); let best = 0, run = 0, prev = null, bestEnd = null;
  list.forEach(k => { run = prev && daysBetween(prev, k) === 1 ? run + 1 : 1; if (run > best){ best = run; bestEnd = k; } prev = k; });
  return {days: best, end: bestEnd, start: bestEnd ? addDays(bestEnd, 1 - best) : null};
}
function currentStreak(){
  const set = readingDays(); let k = todayKey(); if (!set.has(k)) k = addDays(k, -1);
  let n = 0; while (set.has(k)){ n++; k = addDays(k, -1); }
  return n;
}
function yearsWithData(){
  const ys = new Set([new Date().getFullYear()]);
  state.books.forEach(b => {
    if (b.finished) ys.add(Number(b.finished.slice(0, 4)));
    if (b.started) ys.add(Number(b.started.slice(0, 4)));
    (b.sessions || []).forEach(s => s.start && ys.add(new Date(s.start).getFullYear()));
  });
  return Array.from(ys).filter(Boolean).sort((a, b) => b - a);
}
function count(list){ const m = new Map(); list.forEach(x => { if (x) m.set(x, (m.get(x) || 0) + 1); }); return Array.from(m.entries()).sort((a, b) => b[1] - a[1]); }

function yearStats(Y){
  Y = Number(Y);
  const books = state.books;
  const fin = books.filter(b => b.status === "finished" && b.finished && Number(b.finished.slice(0, 4)) === Y).sort((a, b) => a.finished < b.finished ? -1 : 1);
  const started = books.filter(b => b.started && Number(b.started.slice(0, 4)) === Y);
  const dnf = books.filter(b => b.status === "dnf" && b.finished && Number(b.finished.slice(0, 4)) === Y);
  const sess = [];
  books.forEach(b => (b.sessions || []).forEach(s => { if (s.start && new Date(s.start).getFullYear() === Y) sess.push({b, s}); }));
  const minutes = sess.reduce((a, x) => a + sessMin(x.s), 0);
  const sessPg = sess.reduce((a, x) => a + (sessPages(x.s) || 0), 0);
  const pagesFin = fin.reduce((a, b) => a + (Number(b.pages) || 0), 0);
  const pph = speedOf(sess.filter(x => x.b.format !== "audio").map(x => x.s));
  const byMonth = Array(12).fill(0), minByMonth = Array(12).fill(0);
  fin.forEach(b => { if (precOf(b) !== "year" && !b.needsDate) byMonth[parseDay(b.finished).getMonth()]++; });
  sess.forEach(x => minByMonth[new Date(x.s.start).getMonth()] += sessMin(x.s));
  const dayset = new Set(sess.map(x => dayKey(x.s.start)));
  const streak = longestStreak(dayset);
  const dow = Array(7).fill(0); sess.forEach(x => dow[new Date(x.s.start).getDay()] += sessMin(x.s));
  const tod = {morning: 0, afternoon: 0, evening: 0, night: 0};
  sess.forEach(x => { const h = new Date(x.s.start).getHours(); tod[h >= 5 && h < 12 ? "morning" : h < 17 && h >= 12 ? "afternoon" : h >= 17 && h < 21 ? "evening" : "night"] += sessMin(x.s); });
  const withDays = fin.map(b => ({b, days: b.status === "finished" ? bookStats(b).days : null})).filter(x => x.days > 0);
  const fastest = withDays.slice().sort((a, b) => a.days - b.days || (Number(b.b.pages) || 0) - (Number(a.b.pages) || 0))[0] || null;
  const slowest = withDays.slice().sort((a, b) => b.days - a.days)[0] || null;
  const longest = fin.filter(b => Number(b.pages) > 0).sort((a, b) => b.pages - a.pages)[0] || null;
  const shortest = fin.filter(b => Number(b.pages) > 0).sort((a, b) => a.pages - b.pages)[0] || null;
  const avgDays = withDays.length ? withDays.reduce((a, x) => a + x.days, 0) / withDays.length : null;
  const authors = count(fin.map(b => (b.author || "").trim()));
  const genres = count(fin.map(b => (b.genre || "").trim()));
  const rated = fin.filter(b => b.rating).sort((a, b) => b.rating - a.rating || (a.finished < b.finished ? 1 : -1));
  const longSess = sess.slice().sort((a, b) => sessMin(b.s) - sessMin(a.s))[0] || null;
  const topMonth = byMonth.some(n => n) ? byMonth.indexOf(Math.max(...byMonth)) : null;
  const topMinMonth = minByMonth.some(n => n) ? minByMonth.indexOf(Math.max(...minByMonth)) : null;
  const formats = count(fin.map(b => b.format || "print"));
  const mostTime = (() => { const m = new Map(); sess.forEach(x => m.set(x.b, (m.get(x.b) || 0) + sessMin(x.s))); return Array.from(m.entries()).sort((a, b) => b[1] - a[1])[0] || null; })();
  return {Y, fin, started, dnf, sess, minutes, sessPg, pagesFin, pph, byMonth, minByMonth, dayset, streak, dow, tod, fastest, slowest, longest, shortest, avgDays, authors, genres, rated, longSess, topMonth, topMinMonth, formats, mostTime};
}

/* ============================================================
   Loading & saving
   ============================================================ */
let saveTimers = {};
function setBooks(list){ state.books = list.map(normalize); }
function normalize(b){
  b = Object.assign({}, b); b.sessions = Array.isArray(b.sessions) ? b.sessions : []; b.status = STATUS[b.status] ? b.status : "want";
  // The first add form filled Started and Finished with the day the book was added, so finished books
  // added after the fact showed "1 day". Those dates weren't real: clear them and ask for the month instead.
  if ((b.status === "finished" || b.status === "dnf") && !b.finishedPrec && !b.datesChecked && !b.sessions.length &&
      b.started && b.started === b.finished && b.added && dayKey(b.added) === b.finished){
    b.started = null; b.finishedPrec = "year"; b.needsDate = true; b.datesChecked = true; b._migrated = true;
  }
  return b;
}
function saveMigrated(){
  const list = state.books.filter(b => b._migrated);
  list.forEach(b => { delete b._migrated; saveBook(b, true); });
}
function cacheNow(){ lsSet(cacheKey(), state.books); }
function bookById(id){ return state.books.find(b => b.id === id); }
function rowOf(b){ const data = Object.assign({}, b); delete data.id; return {id: b.id, data, updated_at: new Date().toISOString()}; }

function saveBook(b, quiet){
  b.updated = new Date().toISOString();
  const i = state.books.findIndex(x => x.id === b.id);
  if (i < 0) state.books.push(b); else state.books[i] = b;
  cacheNow();
  if (state.mode === "db" && !state.tableMissing){
    clearTimeout(saveTimers[b.id]);
    saveTimers[b.id] = setTimeout(() => pushBook(b.id), 400);
  }
  if (!quiet) render();
}
async function pushBook(id){
  const b = bookById(id); if (!b || !sb) return;
  try{
    const { error } = await sb.from("library_books").upsert(rowOf(b));
    if (error) throw error;
    dequeue(id);
  }catch(e){ enqueue({op: "put", id}); noteSaveError(e); }
}
async function deleteBook(id){
  state.books = state.books.filter(b => b.id !== id);
  cacheNow();
  if (state.mode === "db" && !state.tableMissing && sb){
    try{ const { error } = await sb.from("library_books").delete().eq("id", id); if (error) throw error; dequeue(id); }
    catch(e){ enqueue({op: "del", id}); noteSaveError(e); }
  }
}
function enqueue(item){ const q = lsGet(queueKey(), []).filter(x => x.id !== item.id); q.push(item); lsSet(queueKey(), q); }
function dequeue(id){ lsSet(queueKey(), lsGet(queueKey(), []).filter(x => x.id !== id)); }
let flushing = false;
async function flushQueue(){
  if (flushing || state.mode !== "db" || state.tableMissing || !sb) return;
  const q = lsGet(queueKey(), []); if (!q.length) return;
  flushing = true;
  for (const item of q){
    try{
      if (item.op === "del"){ const { error } = await sb.from("library_books").delete().eq("id", item.id); if (error) throw error; }
      else { const b = bookById(item.id); if (b){ const { error } = await sb.from("library_books").upsert(rowOf(b)); if (error) throw error; } }
      dequeue(item.id);
    }catch(e){ break; }
  }
  flushing = false;
  renderBanner();
}
function isMissingTable(e){ const m = String((e && (e.message || e.code)) || ""); return /42P01|PGRST205|does not exist|could not find the table|schema cache/i.test(m); }
function noteSaveError(e){
  if (isMissingTable(e)){ state.tableMissing = true; }
  renderBanner();
}

async function fetchBooks(){
  if (!sb || state.mode !== "db") return;
  try{
    const { data, error } = await sb.from("library_books").select("id,data,updated_at");
    if (error) throw error;
    state.tableMissing = false;
    const pending = new Set(lsGet(queueKey(), []).map(x => x.id));
    const remote = (data || []).map(r => Object.assign({}, r.data, {id: r.id}));
    const local = new Map(state.books.map(b => [b.id, b]));
    const merged = remote.filter(b => !(pending.has(b.id) && !local.has(b.id))).map(b => pending.has(b.id) && local.has(b.id) ? local.get(b.id) : b);
    state.books.forEach(b => { if (pending.has(b.id) && !merged.find(x => x.id === b.id)) merged.push(b); });
    setBooks(merged);
    cacheNow();
    saveMigrated();
    await adoptLocalBooks();
    render();
    flushQueue();
  }catch(e){
    if (isMissingTable(e)) state.tableMissing = true;
    renderBanner();
  }
}
// Books logged on this device before signing in move into the account.
async function adoptLocalBooks(){
  const local = lsGet("library-books", []);
  if (!local.length || state.tableMissing) return;
  const have = new Set(state.books.map(b => b.id));
  const add = local.filter(b => !have.has(b.id)).map(normalize);
  if (!add.length){ lsDel("library-books"); return; }
  try{
    const { error } = await sb.from("library_books").upsert(add.map(rowOf));
    if (error) throw error;
    state.books = state.books.concat(add); cacheNow(); lsDel("library-books");
    toast("Moved " + plural(add.length, "book") + " from this device into your account.");
  }catch(e){}
}

/* ---------- sign in ---------- */
async function init(){
  window.addEventListener("hashchange", render);
  window.addEventListener("online", flushQueue);
  window.addEventListener("focus", () => { if (state.mode === "db") fetchBooks(); });
  setInterval(tick, 1000);
  if (!window.supabase || !CFG.supabaseUrl || !CFG.supabaseAnonKey){ startLocal(true); return; }
  // Default session storage: the same sign-in as the Recipe Box (same Supabase project, same site).
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  try{ const { data } = await sb.auth.getSession(); setSession(data.session); }catch(e){ setSession(null); }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "INITIAL_SESSION") return;
    if (event === "TOKEN_REFRESHED"){ state.session = session || state.session; return; }
    setTimeout(() => setSession(session), 0); // outside Supabase's auth lock
  });
}
function setSession(session){
  const was = state.session && state.session.user.id;
  state.session = session || null;
  if (session){
    state.mode = "db";
    if (was !== session.user.id){ setBooks(lsGet(cacheKey(), [])); }
    render();
    fetchBooks();
  } else if (lsGet("library-local-mode", false)){
    startLocal(false);
  } else {
    state.mode = "gate"; state.books = []; render();
  }
}
function startLocal(noDb){
  state.mode = "local"; state.noDb = !!noDb;
  setBooks(lsGet("library-books", []));
  saveMigrated();
  render();
}
function loginEmail(s){ s = s.trim(); return s.includes("@") ? s : s.toLowerCase() + KIDS_DOMAIN; }
function openSignIn(mode){
  mode = mode || "in";
  modal('<form id="authForm" novalidate>' +
    '<h3>' + (mode === "up" ? "Create your account" : "Sign in") + '</h3>' +
    '<p class="hint">' + (mode === "up" ? "Your book log is private to your account." : "Same sign-in as the Recipe Box. A Study username works too.") + '</p>' +
    '<div class="field"><label for="a-email">' + (mode === "up" ? "Email" : "Email or username") + '</label><input class="inp" id="a-email" ' + (mode === "up" ? 'type="email" autocomplete="email"' : 'type="text" autocomplete="username" autocapitalize="off"') + ' required></div>' +
    '<div class="field"><label for="a-pass">Password</label><input class="inp" id="a-pass" type="password" autocomplete="' + (mode === "up" ? "new-password" : "current-password") + '" minlength="6" required></div>' +
    '<div class="err" id="aErr" role="alert"></div>' +
    '<div class="acts-row"><button class="link-btn" type="button" data-m="' + (mode === "up" ? "in" : "up") + '">' + (mode === "up" ? "I have an account" : "Create an account") + '</button><span class="spacer"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="submit">' + (mode === "up" ? "Create account" : "Sign in") + '</button></div>' +
  '</form>');
  $("#a-email").focus();
  $("[data-m]").onclick = e => openSignIn(e.target.dataset.m);
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const raw = $("#a-email").value, password = $("#a-pass").value, err = $("#aErr");
    if (!raw.trim() || password.length < 6){ err.textContent = "Enter your " + (mode === "up" ? "email" : "email or username") + " and a password of at least 6 characters."; return; }
    const email = mode === "up" ? raw.trim() : loginEmail(raw);
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; err.textContent = "";
    try{
      const res = mode === "up" ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
      if (res.error) throw res.error;
      if (mode === "up" && !res.data.session){ err.textContent = "Account created, but Supabase wants the email confirmed first. Confirm it from the email (or in Supabase: Authentication → Users), then sign in."; btn.disabled = false; return; }
      closeModal();
      lsDel("library-local-mode");
      toast(mode === "up" ? "Welcome to the Library!" : "Signed in.");
    }catch(x){
      btn.disabled = false;
      const m = String(x.message || "");
      err.textContent = /invalid login/i.test(m) ? "That sign-in and password don't match." : /already registered/i.test(m) ? "That email already has an account. Sign in instead." : m || "Couldn't sign in. Check your connection.";
    }
  };
}
async function signOut(){
  if (!sb) return;
  await Promise.race([sb.auth.signOut({scope: "local"}).catch(() => {}), new Promise(r => setTimeout(r, 4000))]);
  setSession(null);
}

/* ============================================================
   Rendering
   ============================================================ */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (parts[0] === "book" && parts[1]) return {view: "book", id: parts[1]};
  if (parts[0] === "dates") return {view: "dates"};
  if (parts[0] === "review") return {view: parts[2] === "all" ? "yearall" : "review", year: Number(parts[1]) || new Date().getFullYear()};
  return {view: "shelf"};
}
function render(){
  renderTop(); renderBanner(); renderFoot();
  const main = $("#main");
  if (state.mode === "loading"){ main.innerHTML = '<p class="hint">Opening the Library…</p>'; return; }
  if (state.mode === "gate"){ renderGate(main); closeStory(); return; }
  const r = route();
  if (r.view === "book"){ closeStory(); renderBook(main, r.id); }
  else if (r.view === "dates"){ closeStory(); renderDates(main); }
  else if (r.view === "yearall"){ closeStory(); renderYearAll(main, r.year); }
  else { renderShelf(main); if (r.view === "review") openStory(r.year); else closeStory(); }
}
function renderTop(){
  const acts = $("#topActs"), who = $("#whoLine");
  if (state.mode === "db"){
    const name = (state.session.user.email || "").replace(KIDS_DOMAIN, "").split("@")[0];
    who.innerHTML = "Hi, " + esc(name) + ' · <button class="link-btn" type="button" id="soBtn">Sign out</button>';
    $("#soBtn").onclick = signOut;
  } else if (state.mode === "local"){
    who.innerHTML = "On this device only" + (state.noDb ? "" : ' · <button class="link-btn" type="button" id="siBtn">Sign in to keep it everywhere</button>');
    if ($("#siBtn")) $("#siBtn").onclick = () => openSignIn("in");
  } else who.textContent = "Your book log";
  const on = state.mode === "db" || state.mode === "local";
  acts.innerHTML = on ? '<button class="btn gold" type="button" id="yrBtn">★ Year in review</button><button class="btn primary" type="button" id="addBtn">+ Add a book</button>' : "";
  if (on){ $("#addBtn").onclick = () => openBookForm(null); $("#yrBtn").onclick = () => { location.hash = "#/review/" + new Date().getFullYear(); }; }
}
function renderBanner(){
  const el = $("#banner"); const q = lsGet(queueKey(), []);
  let html = "";
  if (state.mode === "db" && state.tableMissing) html = '<div class="banner"><b>One-time setup:</b> the Library\'s table isn\'t in Supabase yet. Run <code>library-setup.sql</code> in Supabase (SQL Editor → New query → paste → Run). Until then, books are kept on this device and will upload once it\'s there.</div>';
  else if (state.mode === "db" && q.length) html = '<div class="banner">' + plural(q.length, "change") + ' waiting to upload. They\'ll go up when the connection is back. <button class="link-btn" type="button" id="retryBtn">Try now</button></div>';
  el.innerHTML = html;
  if ($("#retryBtn")) $("#retryBtn").onclick = () => { flushQueue(); };
}
function renderFoot(){
  const f = $("#foot");
  if (state.mode !== "db" && state.mode !== "local"){ f.innerHTML = ""; return; }
  f.innerHTML = '<button class="link-btn" type="button" id="expBtn">Download my books (backup)</button><span>Book info and covers from Open Library</span>';
  $("#expBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({exported: new Date().toISOString(), books: state.books}, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "library-books-" + todayKey() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
}

function renderGate(main){
  main.innerHTML = '<div class="gate panel">' +
    '<h2>Your books, your stats</h2>' +
    '<p>Log what you\'re reading, time your reading sessions, and get a year in review of everything you read.</p>' +
    '<button class="btn primary" type="button" id="gIn">Sign in</button>' +
    '<button class="btn" type="button" id="gUp">Create an account</button>' +
    '<p class="hint">Same sign-in as the Recipe Box. Each account has its own private book log.</p>' +
    '<button class="link-btn" type="button" id="gLocal" style="align-self:flex-start;font-size:14px">Just try it on this device</button>' +
  '</div>';
  $("#gIn").onclick = () => openSignIn("in");
  $("#gUp").onclick = () => openSignIn("up");
  $("#gLocal").onclick = () => { lsSet("library-local-mode", true); startLocal(false); };
}

/* ---------- shelf ---------- */
function renderShelf(main){
  const Y = new Date().getFullYear();
  const ys = yearStats(Y);
  const reading = state.books.filter(b => b.status === "reading").sort((a, b) => (b.live ? 1 : 0) - (a.live ? 1 : 0) || String(b.updated || "").localeCompare(String(a.updated || "")));
  const streak = currentStreak();
  let html = "";

  // This year so far
  html += '<div class="strip">' +
    tile("Books in " + Y, ys.fin.length, ys.started.length ? plural(ys.started.length, "started", "started") : "finished this year") +
    tile("Pages", ys.pagesFin.toLocaleString(), "in books finished") +
    tile("Time reading", ys.minutes ? fmtHours(ys.minutes) + "<small> h</small>" : "–", ys.sess.length ? plural(ys.sess.length, "session") : "start a timer to track it") +
    tile("Streak", streak ? streak + "<small> " + (streak === 1 ? "day" : "days") + "</small>" : "–", ys.streak.days > 1 ? "best this year: " + ys.streak.days + " days" : "days in a row with a session") +
  '</div>';
  html += '<div class="review-cta"><div><h3>Your ' + Y + ' in books</h3><p>' + (ys.fin.length ? "Tap through your year: " + plural(ys.fin.length, "book") + " so far." : "Finish a book and it shows up here.") + '</p></div><a class="btn" href="#/review/' + Y + '" style="background:#FFF8EC;color:#17201A;border-color:#17201A">Open ▸</a></div>';

  const noDate = state.books.filter(b => b.needsDate).length;
  if (noDate) html += '<div class="banner" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>' + plural(noDate, "finished book") + '</b> ' + (noDate === 1 ? "doesn\'t" : "don\'t") + ' have a finish date yet. Just the month is fine, or “don\'t remember”.</span><a class="btn gold sm" href="#/dates">Set when you finished them →</a></div>';

  // Reading now
  html += '<div class="sec-h"><h2>Reading now</h2>' + (reading.length ? '<span class="sub">' + plural(reading.length, "book") + '</span>' : "") + '</div>';
  if (reading.length) html += '<div class="now-grid">' + reading.map(nowCard).join("") + '</div>';
  else html += '<div class="empty"><h3>Nothing on the go</h3><p>Add a book you\'re reading, or start one from your Want to read list.</p><p><button class="btn primary" type="button" data-act="add" style="margin-top:8px">+ Add a book</button></p></div>';

  // Shelf
  const counts = {finished: 0, want: 0, dnf: 0};
  state.books.forEach(b => { if (counts[b.status] != null) counts[b.status]++; });
  const finYears = Array.from(new Set(state.books.filter(b => b.status === "finished" && b.finished).map(b => b.finished.slice(0, 4)))).sort().reverse();
  html += '<div class="sec-h"><h2>The shelf</h2></div>';
  html += '<div class="filters"><div class="seg" role="group" aria-label="Shelf">' +
    ["finished", "want", "dnf"].map(k => '<button type="button" data-filter="' + k + '" aria-pressed="' + (state.filter === k) + '">' + STATUS[k] + '<span class="c">' + counts[k] + '</span></button>').join("") +
    '</div>' +
    (state.filter === "finished" && finYears.length > 1 ? '<select class="inp" id="shelfYear" style="width:auto" aria-label="Year"><option value="all">All years</option>' + finYears.map(y => '<option' + (state.shelfYear === y ? " selected" : "") + '>' + y + '</option>').join("") + '</select>' : "") +
    '<input class="inp searchbox" id="shelfQ" type="search" placeholder="Search title, author, genre" value="' + esc(state.q) + '" aria-label="Search the shelf"></div>';
  html += '<div class="shelf" id="shelfList">' + shelfItems() + '</div>';
  main.innerHTML = html;

  $$("[data-filter]", main).forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  if ($("#shelfYear")) $("#shelfYear").onchange = e => { state.shelfYear = e.target.value; $("#shelfList").innerHTML = shelfItems(); };
  $("#shelfQ").oninput = e => { state.q = e.target.value; $("#shelfList").innerHTML = shelfItems(); };
  wireBookActs(main);
}
function tile(k, v, s){ return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
function shelfItems(){
  const q = state.q.trim().toLowerCase();
  let list = state.books.filter(b => b.status === state.filter);
  if (state.filter === "finished" && state.shelfYear !== "all") list = list.filter(b => (b.finished || "").startsWith(state.shelfYear));
  if (q) list = list.filter(b => [b.title, b.author, b.genre].join(" ").toLowerCase().includes(q));
  if (!list.length){
    const msg = q ? "No books match “" + esc(state.q) + "”." : state.filter === "finished" ? "Books you finish land here." : state.filter === "want" ? "Add books you want to read next." : "Books you set aside land here. No guilt.";
    return '<div class="empty" style="grid-column:1/-1">' + msg + '</div>';
  }
  if (state.filter === "finished"){
    list.sort((a, b) => String(b.finished || "").localeCompare(String(a.finished || "")));
    let html = "", lastY = null;
    list.forEach(b => {
      const y = (b.finished || "").slice(0, 4) || "No date";
      if (y !== lastY && state.shelfYear === "all" && !q){ html += '<div class="year-h">' + esc(y) + '</div>'; lastY = y; }
      html += spine(b);
    });
    return html;
  }
  list.sort((a, b) => String(b.added || "").localeCompare(String(a.added || "")));
  return list.map(spine).join("");
}
function spine(b){
  const st = bookStats(b);
  let chips = "";
  if (b.status === "finished"){
    if (st.days) chips += '<span class="chip pink">' + plural(st.days, "day") + '</span>';
    else if (b.needsDate) chips += '<span class="chip gold">when?</span>';
    else if (precOf(b) === "month") chips += '<span class="chip">' + MONTHS[parseDay(b.finished).getMonth()] + '</span>';
    if (b.rating) chips += '<span class="stars">' + stars(b.rating) + '</span>';
  } else if (b.status === "want"){
    if (b.pages) chips += '<span class="chip">' + Number(b.pages).toLocaleString() + ' pages</span>';
  } else if (b.status === "dnf" && b.pages){
    chips += '<span class="chip">stopped at p. ' + currentPage(b) + '</span>';
  }
  return '<a class="spine" href="#/book/' + b.id + '">' + coverHTML(b) +
    '<div><h4>' + esc(b.title) + '</h4>' + (b.author ? '<p class="by">' + esc(b.author) + '</p>' : "") + '</div>' +
    (chips ? '<div class="meta">' + chips + '</div>' : "") + '</a>';
}
function nowCard(b){
  const st = bookStats(b), cp = currentPage(b);
  const pct = Math.round(progress(b) * 100);
  let meta = [];
  if (b.started) meta.push("Day <b>" + st.days + "</b> · started " + fmtDay(b.started));
  if (st.minutes) meta.push("<b>" + fmtDur(st.minutes) + "</b> read");
  const pph = st.pph || overallSpeed();
  if (st.left && pph) meta.push("about <b>" + fmtDur(st.left / pph * 60) + "</b> left");
  return '<div class="panel now">' + coverHTML(b) +
    '<div class="info"><h3><a href="#/book/' + b.id + '">' + esc(b.title) + '</a></h3>' +
    (b.author ? '<p class="by">' + esc(b.author) + '</p>' : "") +
    (b.pages ? '<div class="bar" title="' + pct + '%"><i style="width:' + pct + '%"></i></div><div class="meta">Page <b>' + cp + '</b> of ' + Number(b.pages).toLocaleString() + ' · ' + pct + '%</div>' : "") +
    (meta.length ? '<div class="meta">' + meta.join(" · ") + '</div>' : "") +
    '<div class="acts">' + timerButtons(b) + '</div></div></div>';
}
function timerButtons(b){
  if (b.live) return '<button class="btn stop sm" type="button" data-act="stop" data-id="' + b.id + '">■ Stop · <span class="num" data-live="' + b.id + '">' + fmtClock(Date.now() - new Date(b.live.start)) + '</span></button>';
  return '<button class="btn go sm" type="button" data-act="start" data-id="' + b.id + '">▶ Start reading</button>' +
    (b.status === "reading" ? '<button class="btn sm" type="button" data-act="finish" data-id="' + b.id + '">✓ Finished it</button>' : "");
}
function wireBookActs(root){
  $$("[data-act]", root).forEach(el => el.onclick = e => {
    e.preventDefault();
    const b = bookById(el.dataset.id), a = el.dataset.act;
    if (a === "add") return openBookForm(null);
    if (!b) return;
    if (a === "start") startReading(b);
    else if (a === "stop") openSessionForm(b, null, true);
    else if (a === "finish") openFinish(b);
    else if (a === "edit") openBookForm(b);
    else if (a === "log") openSessionForm(b, null, false);
    else if (a === "setstatus") setStatus(b, el.dataset.status);
  });
}
function tick(){
  $$("[data-live]").forEach(el => { const b = bookById(el.dataset.live); if (b && b.live) el.textContent = fmtClock(Date.now() - new Date(b.live.start)); });
}

/* ---------- reading timer ---------- */
function startReading(b){
  if (state.books.some(x => x.live && x.id !== b.id)){
    const other = state.books.find(x => x.live && x.id !== b.id);
    toast("Stop “" + other.title + "” first."); return;
  }
  b.live = {start: new Date().toISOString(), startPage: currentPage(b)};
  if (b.status !== "reading") b.status = "reading";
  if (!b.started) b.started = todayKey();
  b.finished = null;
  saveBook(b);
  toast("Timer started. Happy reading!");
}
function setStatus(b, s){
  b.status = s;
  if (s === "reading" && !b.started) b.started = todayKey();
  if (s === "want"){ b.live = null; }
  saveBook(b);
}

/* ---------- book page ---------- */
function renderBook(main, id){
  const b = bookById(id);
  if (!b){ main.innerHTML = '<a class="btn ghost back" href="#/">← The shelf</a><div class="empty"><h3>Book not found</h3><p>It may have been deleted.</p></div>'; return; }
  const st = bookStats(b), cp = currentPage(b), pct = Math.round(progress(b) * 100);
  const pph = st.pph || (b.format !== "audio" ? overallSpeed() : null);
  let html = '<a class="btn ghost back" href="#/">← The shelf</a>';
  html += '<div class="book-head">' + coverHTML(b) + '<div class="info">' +
    '<span class="status-pill st-' + b.status + '">' + STATUS[b.status] + '</span>' +
    '<h2>' + esc(b.title) + '</h2>' +
    (b.author ? '<p class="by" style="font-size:17px">by ' + esc(b.author) + '</p>' : "") +
    '<div class="meta">' + [b.pages ? Number(b.pages).toLocaleString() + " pages" : "", FORMATS[b.format] || "", b.genre ? esc(b.genre) : ""].filter(Boolean).join(" · ") + '</div>' +
    (b.rating ? '<div class="stars" style="font-size:20px">' + stars(b.rating) + '</div>' : "") +
    datesLine(b, st) +
    (b.pages && b.status !== "want" ? '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="pageset">On page <input class="inp num" id="pageNow" type="number" min="0" max="' + b.pages + '" value="' + cp + '" aria-label="Current page"> of ' + Number(b.pages).toLocaleString() + ' · ' + pct + '%<button class="btn sm" type="button" id="pageSave" hidden>Save</button></div>' : "") +
    '<div class="acts">' +
      (b.status === "reading" || b.status === "want" ? timerButtons(b) : "") +
      (b.status === "want" ? '<button class="btn sm" type="button" data-act="setstatus" data-status="reading" data-id="' + b.id + '">Mark as reading</button>' : "") +
      (b.status === "finished" || b.status === "dnf" ? '<button class="btn sm" type="button" data-act="reread" data-id="' + b.id + '">' + (b.status === "dnf" ? "Pick it back up" : "Read it again") + '</button>' : "") +
      '<button class="btn sm" type="button" data-act="log" data-id="' + b.id + '">+ Log a past session</button>' +
      '<button class="btn sm" type="button" data-act="edit" data-id="' + b.id + '">Edit</button>' +
    '</div>' +
    (b.notes ? '<p class="notes">' + esc(b.notes) + '</p>' : "") +
  '</div></div>';

  // Stats
  const tiles = [];
  if (st.days != null) tiles.push(tile(b.status === "finished" ? "Took" : b.status === "dnf" ? "Read for" : "Reading for", st.days + '<small> ' + (st.days === 1 ? "day" : "days") + '</small>', fmtDay(b.started) + (b.finished && b.status !== "reading" ? " → " + fmtFinished(b) : " → today")));
  if (st.minutes) tiles.push(tile("Time read", fmtDur(st.minutes).replace(/ (h|min)/g, "<small> $1</small>"), plural(st.ss.length, "session")));
  if (st.ss.length) tiles.push(tile("Avg session", fmtDur(st.minutes / st.ss.length).replace(/ (h|min)/g, "<small> $1</small>"), "longest " + fmtDur(Math.max(...st.ss.map(sessMin)))));
  if (st.pph) tiles.push(tile("Speed", Math.round(st.pph) + "<small> pages/h</small>", "about " + (Math.round(60 / st.pph * 10) / 10) + " min a page"));
  if (b.status === "reading" && st.left && pph) tiles.push(tile("To go", fmtDur(st.left / pph * 60).replace(/ (h|min)/g, "<small> $1</small>"), st.left.toLocaleString() + " pages at " + Math.round(pph) + " pages/h" + (st.pph ? "" : " (your usual)")));
  if (st.ch.avgDone) tiles.push(tile("Per chapter", fmtDur(st.ch.avgDone).replace(/ (h|min)/g, "<small> $1</small>"), "average of " + plural(st.ch.doneCount, "finished chapter")));
  if (b.status === "finished" && st.days && b.pages) tiles.push(tile("Pace", Math.round(b.pages / st.days) + "<small> pages/day</small>", "start to finish"));
  if (tiles.length) html += '<div class="sec-h"><h2>Stats</h2></div><div class="strip">' + tiles.join("") + '</div>';

  // Chapters
  if (st.ch.list.length){
    html += '<div class="sec-h"><h2>Chapters</h2><span class="sub">from the chapter on each session</span></div><div class="panel tablewrap"><table class="list"><thead><tr><th>Chapter</th><th class="r">Time</th><th class="r">Pages</th><th class="r">Sessions</th><th>Finished</th></tr></thead><tbody>' +
      st.ch.list.map(c => '<tr><td><b>' + esc(c.label) + '</b></td><td class="r num">' + fmtDur(c.minutes) + '</td><td class="r num">' + (c.pages || "–") + '</td><td class="r num">' + c.sessions + '</td><td>' + (c.done ? '<span class="chip green">✓ ' + fmtDay(dayKey(c.last)) + " " + fmtTime(c.last) + '</span>' : '<span class="chip">in progress</span>') + '</td></tr>').join("") +
      '</tbody></table></div>';
  }

  // Sessions
  html += '<div class="sec-h"><h2>Reading sessions</h2><span class="sub">' + (st.ss.length ? "tap one to change it" : "optional: they power the time and speed stats") + '</span></div>';
  if (st.ss.length){
    html += '<div class="panel tablewrap"><table class="list"><thead><tr><th>Day</th><th>Time</th><th class="r">Length</th><th class="r">Pages</th><th>Chapter</th></tr></thead><tbody>' +
      st.ss.slice().reverse().map(s => {
        const p = sessPages(s);
        return '<tr class="click" data-sess="' + s.id + '" tabindex="0"><td>' + fmtDay(dayKey(s.start)) + '</td><td>' + fmtTime(s.start) + ' – ' + fmtTime(s.end) + '</td><td class="r num">' + fmtDur(sessMin(s)) + '</td><td class="r num">' + (p != null ? (s.startPage + "→" + s.endPage + " <span class=\"hint\">(" + p + ")</span>") : "–") + '</td><td>' + (s.chapter ? esc(s.chapter) + (s.chapterDone ? " ✓" : "") : "") + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  } else {
    html += '<div class="empty">Tap <b>▶ Start reading</b> when you sit down with it, and <b>Stop</b> when you\'re done. It asks what page you\'re on (and the chapter, if you want), and works out your reading speed.</div>';
  }
  main.innerHTML = html;
  wireBookActs(main);
  const rr = $('[data-act="reread"]', main);
  if (rr) rr.onclick = () => {
    if (b.status === "finished" && !confirm("Start “" + b.title + "” again? Your first read stays in your stats as a finished book, and this copy starts fresh.")) return;
    if (b.status === "dnf"){ b.status = "reading"; b.finished = null; b.finishedPrec = "day"; b.needsDate = false; saveBook(b); return; }
    const copy = Object.assign({}, b, {id: uid(), status: "reading", started: todayKey(), finished: null, finishedPrec: "day", needsDate: false, datesChecked: true, sessions: [], live: null, page: 0, rating: 0, added: new Date().toISOString(), rereadOf: b.id});
    saveBook(copy, true); location.hash = "#/book/" + copy.id;
  };
  const pi = $("#pageNow"), ps = $("#pageSave");
  if (pi){
    pi.oninput = () => { ps.hidden = Number(pi.value) === cp; };
    const savePage = () => {
      const v = Math.max(0, Math.min(Number(b.pages) || 1e9, Math.round(Number(pi.value) || 0)));
      b.page = v;
      // Lowering the page also lowers what sessions said, so take the manual number as the truth.
      if (v < cp) (b.sessions || []).forEach(s => { if (Number(s.endPage) > v) s.endPage = v; if (Number(s.startPage) > v) s.startPage = v; });
      if (b.status === "want"){ b.status = "reading"; if (!b.started) b.started = todayKey(); }
      saveBook(b);
      if (b.pages && v >= Number(b.pages) && b.status === "reading") openFinish(b);
      else toast("Page saved.");
    };
    ps.onclick = savePage;
    pi.onkeydown = e => { if (e.key === "Enter") savePage(); };
  }
  $$("[data-sess]", main).forEach(tr => {
    const open = () => openSessionForm(b, b.sessions.find(s => s.id === tr.dataset.sess), false);
    tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); };
  });
}
function datesLine(b, st){
  if (b.status === "want") return b.added ? '<div class="meta">Added ' + fmtDay(dayKey(b.added)) + '</div>' : "";
  const bits = [];
  if (b.started) bits.push("Started <b>" + fmtDay(b.started) + "</b>");
  if (!b.started && (b.status === "finished" || b.status === "dnf") && !b.needsDate && precOf(b) === "day") bits.push("start date not set");
  if (b.finished && (b.status === "finished" || b.status === "dnf")){
    if (b.needsDate) bits.push('finish date not set · <a href="#/dates" style="color:var(--gold);font-weight:700">set it</a>');
    else bits.push((b.status === "dnf" ? "stopped " : "finished ") + "<b>" + (precOf(b) === "day" ? fmtDay(b.finished) : "in " + fmtFinished(b, true)) + "</b>");
  }
  return bits.length ? '<div class="meta">' + bits.join(" · ") + '</div>' : "";
}

/* ---------- set finish dates for many books at once ---------- */
function renderDates(main){
  const list = state.books.filter(b => (b.status === "finished" || b.status === "dnf") && (b.needsDate || precOf(b) !== "day"))
    .sort((a, b) => (b.needsDate ? 1 : 0) - (a.needsDate ? 1 : 0) || String(a.title).localeCompare(String(b.title)));
  const thisY = new Date().getFullYear();
  let html = '<a class="btn ghost back" href="#/">← The shelf</a>';
  html += '<div class="sec-h" style="margin-top:0"><h2>When did you finish them?</h2><span class="sub">The month is plenty. Pick “Don\'t remember” if you don\'t know.</span></div>';
  if (!list.length){ main.innerHTML = html + '<div class="empty"><h3>All set</h3><p>Every finished book has a date.</p></div>'; return; }
  html += '<div class="panel tablewrap"><table class="list"><thead><tr><th>Book</th><th>Month</th><th>Year</th><th></th></tr></thead><tbody>' +
    list.map(b => {
      const known = !b.needsDate && precOf(b) === "month" ? parseDay(b.finished).getMonth() + 1 : 0;
      const y = b.finished ? b.finished.slice(0, 4) : thisY;
      return '<tr data-row="' + b.id + '"><td><div style="display:flex;gap:10px;align-items:center;--cw:34px">' + coverHTML(b) + '<div><b>' + esc(b.title) + '</b>' + (b.author ? '<br><span class="hint">' + esc(b.author) + '</span>' : "") + '</div></div></td>' +
        '<td><select class="inp" data-month style="min-width:150px"><option value="0">Don\'t remember</option>' + MONTHS_LONG.map((m, i) => '<option value="' + (i + 1) + '"' + (known === i + 1 ? " selected" : "") + '>' + m + '</option>').join("") + '</select></td>' +
        '<td><input class="inp num" data-year type="number" min="1900" max="' + thisY + '" value="' + y + '" style="width:96px"></td>' +
        '<td><button class="link-btn" type="button" data-exact="' + b.id + '" style="font-size:13px;white-space:nowrap">Exact dates…</button></td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<div class="err" id="dErr" role="alert" style="margin-top:12px"></div>' +
    '<div class="acts-row" style="margin-top:14px"><a class="btn ghost" href="#/">Cancel</a><button class="btn primary" type="button" id="dSave">Save all</button></div>';
  main.innerHTML = html;
  $$("[data-exact]", main).forEach(x => x.onclick = () => openBookForm(bookById(x.dataset.exact)));
  $("#dSave").onclick = () => {
    const rows = $$("[data-row]", main); let bad = null;
    const plan = rows.map(tr => {
      const m = Number($("[data-month]", tr).value), y = Math.round(Number($("[data-year]", tr).value));
      if (!(y >= 1900 && y <= thisY)) bad = bad || tr;
      return {b: bookById(tr.dataset.row), m, y};
    });
    if (bad){ $("#dErr").textContent = "Check the years: each one needs to be between 1900 and " + thisY + "."; $("[data-year]", bad).focus(); return; }
    let n = 0;
    plan.forEach(({b, m, y}) => {
      if (!b) return;
      const finished = m ? y + "-" + pad(m) + "-01" : y + "-01-01";
      if (m && finished > todayKey()) return;
      b.finished = finished; b.finishedPrec = m ? "month" : "year"; b.needsDate = false; b.started = null; b.datesChecked = true;
      saveBook(b, true); n++;
    });
    toast("Saved " + plural(n, "book") + ".");
    location.hash = "#/";
  };
}

/* ---------- modals ---------- */
function modal(html){
  const ov = $("#ov");
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  ov.hidden = false;
  document.body.style.overflow = "hidden";
  ov.onclick = e => { if (e.target === ov || e.target.closest("[data-close]")) closeModal(); };
  ov.onkeydown = e => { if (e.key === "Escape") closeModal(); };
}
function closeModal(){ const ov = $("#ov"); ov.hidden = true; ov.innerHTML = ""; document.body.style.overflow = ""; }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

    '<div class="row2" id="f-dates"><div class="field" id="w-started"><label for="f-started">Started <span id="l-startopt" style="font-weight:500">(optional)</span></label><input class="inp" id="f-started" type="date" value="' + esc(d.started || "") + '"></div>' +

  let status = d.status, rating = d.rating || 0, picked = {cover: d.cover, olKey: d.olKey, isbn: d.isbn};
  // Books added as already finished usually get "Just the month": you rarely know the exact days.

  let autoStart = isNew; // the Started box still holds the default "today"
  $("#f-started").addEventListener("input", () => { autoStart = false; });
  const syncStatus = () => {

    $$("#f-mode button").forEach(x => x.setAttribute("aria-pressed", x.dataset.m === mode));
    $("#w-mode").hidden = !done;

    $("#f-dates").hidden = status === "want" || (done && mode !== "day");
    $("#w-finished").hidden = !done;
    $("#l-startopt").hidden = !done;
    $("#f-approx").hidden = !done || mode === "day";
    $("#w-month").hidden = mode !== "month";
    $("#f-approxnote").hidden = !done || mode === "day";
    $("#f-approxnote").textContent = mode === "month" ? "It counts in that month. Days-to-read is skipped." : "It counts in that year, but not in any month. Days-to-read is skipped.";
    $("#l-finished").textContent = status === "dnf" ? "Stopped" : "Finished";
    $("#w-rating").hidden = !done;

    if (done && mode === "day" && !$("#f-finished").value) $("#f-finished").value = todayKey();

  };
  $$("#f-mode button").forEach(x => x.onclick = () => { mode = x.dataset.m; syncStatus(); });
  syncStatus();
  $$("#f-status button").forEach(x => x.onclick = () => { status = x.dataset.s; syncStatus(); });
  $$("#f-rate button").forEach(x => x.onclick = () => { const n = Number(x.dataset.r); rating = rating === n ? 0 : n; $$("#f-rate button").forEach(y => y.classList.toggle("on", Number(y.dataset.r) <= rating)); });
  const doSearch = () => olSearch($("#olq").value, hit => {
    $("#f-title").value = hit.title; $("#f-author").value = hit.author || "";
    if (hit.pages) $("#f-pages").value = hit.pages;
    if (hit.genre && !$("#f-genre").value) $("#f-genre").value = hit.genre;
    picked = {cover: hit.cover || "", olKey: hit.key, isbn: hit.isbn || ""};
    $("#f-cover").value = picked.cover;
  });
  $("#olGo").onclick = doSearch;
  $("#olq").onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); doSearch(); } };
  if (isNew) $("#olq").focus();
  if (!isNew) $("#delBook").onclick = async () => {
    if (!confirm("Delete “" + b.title + "” and its " + plural((b.sessions || []).length, "session") + "? This can't be undone.")) return;
    await deleteBook(b.id); closeModal(); location.hash = "#/"; render(); toast("Deleted.");

  $("#bookForm").onsubmit = e => {
    e.preventDefault();
    const err = $("#fErr");
    const title = $("#f-title").value.trim();
    if (!title){ err.textContent = "Give it a title."; $("#f-title").focus(); return; }
    const done = status === "finished" || status === "dnf";
    let started = status === "want" ? (d.started || null) : ($("#f-started").value || null);
    let finished = null, prec = "day";
    if (done && mode === "day") finished = $("#f-finished").value || todayKey();
    if (done && mode !== "day"){
      const y = Math.round(Number($("#f-year").value));
      if (!(y >= 1900 && y <= new Date().getFullYear())){ err.textContent = "Enter the year you finished it."; return; }

      if (mode === "month" && finished > todayKey()){ err.textContent = "That month hasn't happened yet."; return; }

    const out = Object.assign({}, b || {id: uid(), sessions: [], added: new Date().toISOString(), page: 0}, {

    if (status !== "reading" && status !== "want") out.live = null;
    if (status === "want"){ out.live = null; }
    closeModal();
    saveBook(out, true);
    if (isNew){ location.hash = "#/book/" + out.id; toast("Added “" + title + "”."); }
    render();
  };
